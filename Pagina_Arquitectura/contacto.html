<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura Moderna | Inicio</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="body">
    <h1>Arquitectura Moderna</h1>
    <header class="header">
        <img src="imagenes/edificio-moderno-de-una-casa.webp" alt="Logo" class="header__logo">
        <nav class="nav">
            <a href="index.html" class="nav__link nav">Inicio</a>
            <a href="nosotros.html" class="nav__link">Nosotros</a>
            <a href="servicios.html" class="nav__link">Servicios</a>
            <a href="contacto.html" class="nav__link">Contacto</a>
        </nav>
    </header>

    <main class="main">
        <form class="form" id="contactForm">
            <input type="text" placeholder="Nombre" class="form__input" required>
            <input type="text" placeholder="Apellido" class="form__input" required>
            <input type="email" placeholder="Correo" class="form__input" required>
            <input type="password" placeholder="Contraseña" class="form__input" required>
            <input type="date" class="form__input" required>
            <textarea placeholder="Mensaje" class="form__textarea" required></textarea>
            <button type="submit" class="form__button">Enviar</button>
        </form>
        
        
    </main>

    <footer class="footer">
        <div class="footer__social">
            <a href="#" class="footer__link"><img src="iconos/facebook.wep" alt="Facebook">Facebook</a>
            <a href="#" class="footer__link"><img src="iconos/instagram.wep" alt="Instagram">Instagram</a>
            <a href="#" class="footer__link"><img src="iconos/tik-tok.wep" alt="TikTok">TikTok</a>
        </div>
    </footer>
</body>
</html>
